<!DOCTYPE html>
<html>
<head>
    <title>Motor de Seguridad</title>
</head>
<body>

<h2>Generar Reporte</h2>

<input type="text" id="ip" placeholder="Ej: 192.168.1.1">
<button onclick="scan()">Generar Reporte</button>

<br><br>

<div id="barra" style="width:300px;height:20px;border:1px solid black;">
    <div id="progreso" style="height:100%;width:0%;background:green;"></div>
</div>

<br>

<div id="estado"></div>
<div id="resultado"></div>

<script>
function scan() {
    const ip = document.getElementById("ip").value;
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");
    const barra = document.getElementById("progreso");

    estado.innerHTML = "⏳ Analizando...";
    resultado.innerHTML = "";
    barra.style.width = "0%";

    let progreso = 0;
    let intervalo = setInterval(() => {
        progreso += 10;
        barra.style.width = progreso + "%";
        if (progreso >= 90) clearInterval(intervalo);
    }, 500);

    fetch(`/scan?ip=${ip}`)
    .then(res => {
        if (!res.ok) {
            throw new Error("Error HTTP " + res.status);
        }
        return res.json();
    })
    .then(data => {
        clearInterval(intervalo);
        barra.style.width = "100%";

        estado.innerHTML = "✅ Escaneo iniciado. Recibirás el reporte por correo en breve.";

        let html = "<h3>Resultados:</h3>";

        if (data.puertos_detectados) {
            data.puertos_detectados.forEach(p => {
                html += `
                    <p>
                    🔹 Puerto ${p.puerto} (${p.servicio})<br>
                    Versión: ${p.version}
                    </p>
                `;
            });
        }

        resultado.innerHTML = html;
    })
    .catch(() => {
        estado.innerHTML = "❌ Error en el escaneo";
    });
}
</script>

</body>
</html>

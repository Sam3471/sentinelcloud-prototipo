version: '3.8'

services:
  sentinelcloud:
    build: .
    image: sentinelcloud:latest
    container_name: sentinelcloud_app
    # Inyecta automáticamente las variables de entorno desde tu archivo .env local
    env_file:
      - .env
    # Mapea la carpeta local para que los PDFs generados aparezcan directamente en tu equipo
    volumes:
      - .:/app
    # Argumento por defecto que recibe el main.py (tu archivo JSON de pruebas)
    command: ["nmap_scan.json"]